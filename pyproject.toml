[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-dashboard"
version = "1.0.0"
description = "Crypto Sentiment & Market Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.14.0",
    "dash-mantine-components>=0.12.1",
    "dash-iconify>=0.1.2",
    "pandas>=2.0.0",
    "plotly>=5.17.0",
    "scikit-learn>=1.3.0",
    "gunicorn>=21.2.0",
    "asgiref>=3.7.2",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.3",
    "sentry-sdk[flask]>=1.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-asyncio>=0.21.1",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pandas-stubs>=2.0.0"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"] # flake8, isort, pyupgrade, bugbear
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
